name: 'OpenText Functional Testing GitHub Action'
description: 'Enable your GitHub repository to trigger FT test runs'
inputs:
  runType:
    description: 'Type of run: filesystem | alm | alm-lab'
    required: false
    default: "filesystem"
# This section defines FileSystem-specific configuration inputs
  testPaths:
    description: 'Relative path to a tests directory, to a specific test folder or to an MTBX file (i.e. "path\to\folder" or "path\to\GUITest1" or "path\to\yourfile.mtbx"). 
                For multiple individual tests you can use an array of paths: ["path\\to\\GUITest1", "path\\to\\GUITest2", ...]. 
                Any path must be relative to the repository root.
                IMPORTANT: Absolute paths are not allowed.
                GUI and API tests are supported.
                If using a .mtbx file, the test paths inside it must be relative to your GitHub organization, for example:
                  <Mtbx>
                    <Test name="GUITest1" path="your-repository-name\path\to\GUITest1"></Test>
                    <Test name="GUITest2" path="your-repository-name\path\to\GUITest2"></Test>
                  </Mtbx>'
    required: false # required for runType "filesystem" only.
  timeout:
    description: 'The number of seconds before the test run times out'
    required: false
    default: ""
  cancelRunOnFailure:
    description: 'true | false => Indicates whether to cancel the test run on first failure'
    required: false
    default: "false"
  githubToken:
    description: 'GitHub PAT'
    required: true

# This section defines ALM-specific configuration inputs, including both: regular ALM and ALM Lab Management runs
  almServerUrl:
    description: 'The URL of the ALM server. Format: http(s)://{hostname-or-ip}[:{port}]/qcbin 
                  Example: http://10.105.32.108:8080/qcbin'
    required: false
  almSSOEnabled:
    description: 'true | false => Indicates whether to use the SSO authentication mode when login to the ALM server. 
                  Requires almClientId and almApiKeySecret'
    required: false
    default: "false"
  almUsername:
    description: 'The user name to use for the ALM connection. Required if almSSOEnabled is false'
    required: false
  almPassword:
    description: 'The password to use for the ALM connection. Required if almSSOEnabled is false'
    required: false
  almClientId:
    description: 'The client ID used for login. Required if almSSOEnabled is true'
    required: false # required if almSSOEnabled is true
  almApiKeySecret:
    description: 'The API key secret used for login. Required if almSSOEnabled is true'
    required: false # required if almSSOEnabled is true
  almDomain:
    description: 'The ALM domain name where the ALM projects can be found'
    required: false
  almProject:
    description: 'The ALM project to open under the specified ALM domain'
    required: false

# This section defines regular ALM specific configuration inputs
  almTestSets:
    description: 'The path to an ALM test set or ALM folder with test sets (i.e. "path\to\folder" or "path\to\TestSet1"). 
                  For multiple test sets you can use an array of paths: ["path\\to\\TestSet1", "path\\to\\TestSet2", ...]. 
                  The "Root" ALM folder is optional. Required for runType "alm".'
    required: false # required for runType "alm" only.
  almTimeout:
    description: 'The number of seconds before the ALM test run times out. Default = -1 (no timeout)'
    required: false
    default: "-1"
  almTestSetsOrderByCriteria:
    description: 'id | name => The criteria used to order the execution of test sets. 
                  Use "id" to sort by test set ID in ascending order, or "name" to sort alphabetically by test set name. 
                  Only used when runType is "alm".'
    required: false
    default: "name"
  almRunMode:
    description: '
      "LOCAL"        => the ALM tests run on the local machine (self-hosted runner).
      "REMOTE"       => the ALM tests run on a the machine specified in the almRunHost parameter.
      "PLANNED_HOST" => the ALM tests run on the machines configured in the ALM test set. Only test sets of type "Default" are supported.'
    required: false
    default: "LOCAL"
  almRunHost:
    description: 'The hostname or IP address of the machine on which to run the ALM tests.
                  Only used if almRunMode is "REMOTE".'
    required: false # required if almRunMode is "REMOTE".

# This section defines ALM Lab Management specific configuration inputs
  almTestSetId:
    description: 'The ID of the Functional Test Set to run. 
                  Either almTestSetId or almBvsId is required for runType "alm-lab"'
    required: false
  almBvsId:
    description: 'The ID of Build Verification Suite (BVS) to be run
                  Either almTestSetId or almBvsId is required for runType "alm-lab"'
    required: false
  almTimeslotDuration:
    description: 'The amount of time needed on the host to run this test set/verification suite, in minutes (minimum = 30)'
    required: false
    default: "30"
  almEnvConfigId:
    description: 'The ID of the environment configuration to use for the test run
                  To find the ID of your environment configuration, right-click the entity, copy the URL, and paste it to a text editor. 
                  Use the number associated with the EntityID at the end of the URL'
    required: false
    default: "0"

# This section defines common configuration inputs for FileSystem, ALM, and ALM Lab run types
  resultTestNameOnly:
    description: '
                  Indicates whether the test results summary file should include only test names for FT tests, rather than full paths. 
                  By default the test results summary file includes the full path of the FT test. 
                  For example: <testcase name="C:\tests\GUITest1". 
                  When this parameter is set to "true", the results show the test name only: <testcase name="GUITest1".
                  NOTE: This option is applicable to FileSystem and classic ALM run types only.'
    required: false
    default: "true"
  resultUnifiedTestClassname:
    description: 'For example, if the test path is: "C:\UFTTests\Level1\Level2\Level3\GUITest1" and this parameter is set to "true", the classname will be "file:///C:/UFTTests/Level1/Level2/Level3" (the absolute path of the closest parent folder). This result is consistent, whether you use an MTB / MTBX file or a folder path (with one or more tests stored at folder and/or subfolders level). 
                  If this parameter is set to "false", the classname can be: "All-Tests.Test group" if the properties file provides the full path to the test folder, or "All-Tests.<path to the mtb or mtbx file>" if the properties file provides a mtb / mtbx file path, or "All-Tests.C:\UFTTests\Level1" if the properties file provides a partial path (to the subfolder Level1).
                  NOTE: This option is applicable to FileSystem and classic ALM run types only.'
    required: false
    default: "false"
  ftlUrl:
    description: 'The URL of OpenText FTToolsLauncher.exe.
                  NOTE: This option is applicable to FileSystem and classic ALM run types only.'
    required: false
    default: "https://github.com/MicroFocus/ADM-FT-ToolsLauncher/releases/download/v26.3.0/FTToolsLauncher_net48.exe"
  archiveReportsAsSingleArtifact:
    description: 'If set to "true", all Functional Testing reports will be archived and uploaded as a single artifact. 
                  Otherwise, each test report will be archived and uploaded separately.'
    required: false
    default: "false"
  logLevel:
    description: 'Sets the log level (1-5): 1-trace, 2-debug, 3-info, 4-warn, 5-error'
    required: false
    default: "3"
  cleanupTestRunFiles:
    description: 'Indicates whether to delete the test run files from the runner after the test run is completed. 
                  Use for troubleshooting purposes only.'
    required: false
    default: "true"
  failIfNotPassed:
    description: 'Indicates whether to fail the workflow step when the FT run status is not Passed'
    required: false
    default: "true"

outputs:
  exitCode:
    description: 'FT process exit code'
  status:
    description: 'FT final status (Passed|Failed|Unstable|Aborted|Unknown)'

runs:
  using: 'node24'
  main: 'dist/index.js'
